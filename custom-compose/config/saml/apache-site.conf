<VirtualHost *:80>
    # Clients reach this vhost as https://saml.test (nginx terminates TLS). With these, Apache's
    # own redirects and SERVER_PORT (443, not 80) match that, so SimpleSAMLphp's getSelfURL()
    # builds https://saml.test/… rather than https://saml.test:80/… for pages outside /simplesaml.
    ServerName https://saml.test:443
    UseCanonicalName On

    DocumentRoot /var/www/site

    SetEnv SIMPLESAMLPHP_CONFIG_DIR /etc/simplesamlphp/config
    # Traffic reaches this vhost only through nginx TLS. SimpleSAMLphp refuses to
    # set a Secure cookie when it thinks the request is plain HTTP
    # (src/SimpleSAML/Utils/HTTP.php, setCookie()).
    SetEnv HTTPS on

    Alias /simplesaml /var/simplesamlphp/public
    <Directory /var/simplesamlphp/public>
        Require all granted
    </Directory>

    <Directory /var/www/site/lib>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
