# `ohrm saml up` copies this block into config/nginx/virtual-servers/ only once its
# certificate exists: nginx refuses to start on a block whose certificate is missing.
#
# No add_header here. One add_header in this block would drop every header it now
# inherits from the http level in nginx.conf.
server {
    listen 443 ssl http2;
    server_name saml.test;

    ssl_certificate     /etc/nginx/cert/saml/cert.pem;
    ssl_certificate_key /etc/nginx/cert/saml/key.pem;

    location / {
        # A literal address is not resolved at start, so nginx starts, and answers
        # 502 for saml.test, while dev_saml is down.
        proxy_pass http://10.5.2.7;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
